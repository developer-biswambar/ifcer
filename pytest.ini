[pytest]
# Pytest configuration for IFCER Batch Service

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers - fail on unknown markers
    --strict-markers
    # Coverage options (if pytest-cov is installed)
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    # Disable warnings summary (optional)
    # -p no:warnings

# Custom markers
markers =
    unit: Unit tests that use mocks and don't require external services
    integration: Integration tests that may require AWS or external services
    slow: Slow running tests
    service: Tests for service layer
    router: Tests for API endpoints
    utils: Tests for utility functions

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
# Requires pytest-timeout
timeout = 30

# Fail on first error (useful for CI/CD)
# addopts = -x
