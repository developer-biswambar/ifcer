version: '3.8'

services:
  localstack:
    container_name: ifcer-localstack
    image: localstack/localstack:latest
    ports:
      # LocalStack gateway
      - "4566:4566"
      # LocalStack dashboard (Pro only)
      # - "4510-4559:4510-4559"
    environment:
      # Services to emulate (S3, DynamoDB)
      - SERVICES=s3,dynamodb

      # AWS region
      - DEFAULT_REGION=eu-south-1

      # Enable debug logging
      - DEBUG=1

      # Data persistence directory
      - DATA_DIR=/tmp/localstack/data

      # Enable CORS for local development
      - EXTRA_CORS_ALLOWED_ORIGINS=*

      # Hostname for S3 bucket URLs
      - HOSTNAME_EXTERNAL=localhost

      # Use single region mode
      - AWS_DEFAULT_REGION=eu-south-1

      # Disable usage analytics
      - DISABLE_EVENTS=1

    volumes:
      # Persist LocalStack data between restarts
      - ./localstack-data:/tmp/localstack

      # Mount initialization scripts
      - ./scripts/localstack:/docker-entrypoint-initaws.d

      # Docker socket for Lambda support (optional)
      # - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - ifcer-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ifcer-network:
    name: ifcer-network
    driver: bridge
